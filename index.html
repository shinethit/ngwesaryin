<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    
    <!-- ⭐ iOS PWA — REQUIRED -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ငွေစာရင်း" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#059669" />
    
    <!-- ⭐ apple-touch-icon — REQUIRED (iOS home screen icon) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />
    
    <!-- ⭐ Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- ⭐ Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    
    <title>ငွေစာရင်း - Income, Expense & Debt Manager</title>
    <meta name="description" content="ဝင်ငွေ၊ ထွက်ငွေနှင့် အကြွေး (ပေးရန်/ရရန်) စာရင်းများကို စနစ်တကျ မှတ်တမ်းတင်နိုင်သော ဘဏ္ဍာရေး စီမံခန့်ခွဲမှု ဆော့ဖ်ဝဲ" />
    
    <!-- ⭐ Cache-Control meta tags ဖျက်ပြီ — iOS PWA install block လုပ်နေတာ -->
    <!-- 
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    -->
  </head>
  <body>
    <!-- ကျန်တာ အတူတူ -->
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #047857; background: #F8FAFC; padding: 24px; text-align: center;">
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">ငွေစာရင်း စနစ်ဖွင့်နေပါသည်...</div>
        <div style="font-size: 14px; color: #64748B;">Loading NgweSarYin Application...</div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 24px; font-family: sans-serif; color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; max-width: 600px; margin: 40px auto; text-align: center;"><h3 style="margin-top:0; font-size: 18px; font-weight: bold;">Application Error</h3><p style="font-size: 14px; color: #475569;">' + (e.message || 'Unknown startup error') + '</p><button onclick="window.location.reload()" style="margin-top: 12px; padding: 8px 16px; background: #059669; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Reload Application</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
