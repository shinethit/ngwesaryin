<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="innerCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#34D399" stroke-width="6" stroke-opacity="0.25" />

  <!-- Icon Graphic: Wallet/Vault with Glowing Gold Coins -->
  <g filter="url(#shadow)">
    <!-- Golden Coin Behind -->
    <circle cx="256" cy="220" r="110" fill="url(#coinGrad)" stroke="#B45309" stroke-width="6" />
    <circle cx="256" cy="220" r="88" fill="none" stroke="#FEF08A" stroke-width="4" stroke-dasharray="8 6" />
    <circle cx="256" cy="220" r="65" fill="url(#innerCoin)" opacity="0.9" />
    <!-- Myanmar Kyat / Currency Symbol "K" stylized -->
    <text x="256" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#78350F" text-anchor="middle">Ks</text>

    <!-- Financial Growth Arrow Overlay -->
    <g transform="translate(196, 290)">
      <!-- Card Container for Front Vault -->
      <rect x="-36" y="0" width="192" height="120" rx="24" fill="#064E3B" stroke="#10B981" stroke-width="4" />
      <!-- Front Badge -->
      <rect x="-16" y="20" width="70" height="24" rx="8" fill="#10B981" opacity="0.3" />
      <!-- Growth Pulse -->
      <path d="M-10 80 L30 50 L65 65 L120 25" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <polygon points="120,15 125,35 105,30" fill="#34D399" />
    </g>
  </g>
</svg>
